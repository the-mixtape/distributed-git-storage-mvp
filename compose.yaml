name: distributed-git-storage

services:
  control-plane:
    build:
      context: .
      dockerfile: src/DistributedGitStorage.Web/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=gitserver;Username=gitserver;Password=gitserver
    depends_on:
      postgres:
        condition: service_healthy
      storage-1:
        condition: service_healthy
      storage-2:
        condition: service_healthy
      storage-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitserver
      POSTGRES_USER: gitserver
      POSTGRES_PASSWORD: gitserver
    ports:
      - "55632:5432"
    volumes:
      - postgres-csharp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitserver -d gitserver"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage-1:
    build:
      context: .
      dockerfile: src/DistributedGitStorage.StorageNode/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - storage-1-data:/var/lib/git/repositories
    healthcheck: &storage-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage-2:
    build:
      context: .
      dockerfile: src/DistributedGitStorage.StorageNode/Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - storage-2-data:/var/lib/git/repositories
    healthcheck: *storage-healthcheck

  storage-3:
    build:
      context: .
      dockerfile: src/DistributedGitStorage.StorageNode/Dockerfile
    ports:
      - "8083:8080"
    volumes:
      - storage-3-data:/var/lib/git/repositories
    healthcheck: *storage-healthcheck

volumes:
  postgres-csharp-data:
  storage-1-data:
  storage-2-data:
  storage-3-data:

apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: distributed-git-storage
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/part-of: distributed-git-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/part-of: distributed-git-storage
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: control-plane
          image: distributed-git-storage-control-plane
          imagePullPolicy: IfNotPresent
          env:
            - name: ConnectionStrings__PostgreSql
              valueFrom:
                secretKeyRef:
                  name: database-connection
                  key: connection-string
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

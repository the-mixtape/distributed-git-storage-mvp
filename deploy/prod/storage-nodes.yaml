apiVersion: v1
kind: Service
metadata:
  name: storage-node
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: storage-node
    app.kubernetes.io/part-of: distributed-git-storage
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-node
spec:
  serviceName: storage-node
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-node
      app.kubernetes.io/part-of: distributed-git-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-node
        app.kubernetes.io/part-of: distributed-git-storage
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: storage-node
                    app.kubernetes.io/part-of: distributed-git-storage
      containers:
        - name: storage-node
          image: distributed-git-storage-node
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: repositories
              mountPath: /var/lib/git/repositories
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: repositories
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: company-rwo-retain
        resources:
          requests:
            storage: 500Gi

apiVersion: v1
kind: Namespace
metadata:
  name: distributed-git-storage
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: distributed-git-retain
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: distributed-git-storage
type: Opaque
stringData:
  POSTGRES_DB: gitserver
  POSTGRES_USER: gitserver
  POSTGRES_PASSWORD: gitserver
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: distributed-git-storage
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: distributed-git-storage
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: distributed-git-retain
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storage-node
  namespace: distributed-git-storage
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: storage-node
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-node
  namespace: distributed-git-storage
spec:
  serviceName: storage-node
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: storage-node
  template:
    metadata:
      labels:
        app: storage-node
    spec:
      containers:
        - name: storage-node
          image: distributed-git-storage-node:minikube
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repositories
              mountPath: /var/lib/git/repositories
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: repositories
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: distributed-git-retain
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: distributed-git-storage
spec:
  type: NodePort
  selector:
    app: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: distributed-git-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: distributed-git-storage-control-plane:minikube
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__PostgreSql
              value: Host=postgres;Port=5432;Database=gitserver;Username=gitserver;Password=gitserver
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10

